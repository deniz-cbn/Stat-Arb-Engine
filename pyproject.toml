[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb"
version = "0.1.0"
description = "Statistical arbitrage backtester: Johansen cointegration + Ornstein-Uhlenbeck thresholds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "yfinance"]

[tool.setuptools]
packages = ["statarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
